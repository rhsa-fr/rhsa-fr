<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes orbit {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -2000; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .bg { fill: #07090e; stroke: #1e293b; stroke-width: 1.5; rx: 14px; }
    .beam {
      fill: none;
      stroke: url(#beam-grad);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 200 1800;
      animation: orbit 6s linear infinite;
      filter: url(#glow);
      rx: 14px;
    }
    .title {
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 0.25em;
      fill: #f8fafc;
    }
    .sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: 0.35em;
      fill: #38bdf8;
      text-transform: uppercase;
      animation: pulse 3s ease-in-out infinite;
    }
    .grid-line { stroke: #0f172a; stroke-width: 1; }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="796" height="196" class="bg"/>

  <!-- Subtle BG Lines -->
  <line x1="2" y1="50" x2="798" y2="50" class="grid-line"/>
  <line x1="2" y1="150" x2="798" y2="150" class="grid-line"/>
  <line x1="200" y1="2" x2="200" y2="198" class="grid-line"/>
  <line x1="600" y1="2" x2="600" y2="198" class="grid-line"/>

  <!-- Laser Beam Border -->
  <rect x="2" y="2" width="796" height="196" class="beam"/>

  <!-- Typography -->
  <g transform="translate(400, 105)" text-anchor="middle">
    <text y="-8" class="title">RHSA-FR</text>
    <text y="32" class="sub">[ SYSTEM READY ]</text>
  </g>
</svg>
