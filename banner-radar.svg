<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="radar-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes scan {
      0% { transform: translateY(-200px); }
      100% { transform: translateY(200px); }
    }
    @keyframes typing {
      from { width: 0; }
      to { width: 14ch; }
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }
    .radar-box { fill: #040d0a; stroke: #064e3b; stroke-width: 1.5; rx: 12px; }
    .type-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
    }
    .glitch-text {
      font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
      font-size: 32px;
      font-weight: 700;
      color: #34d399;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid #10b981;
      width: 14ch;
      animation: typing 3s steps(14) infinite alternate, blink 0.8s infinite;
      letter-spacing: 0.15em;
    }
  </style>

  <rect x="2" y="2" width="796" height="196" class="radar-box"/>
  <rect x="2" y="2" width="796" height="196" rx="12" fill="url(#radar-grid)"/>

  <!-- Scanning ray -->
  <rect x="2" y="0" width="796" height="40" fill="url(#scan-grad)">
    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 -50"
      to="0 250"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>

  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="type-wrap">
      <div class="glitch-text">&gt; rhsa-fr_</div>
    </div>
  </foreignObject>
</svg>
