<svg fill="none" viewBox="0 0 800 160" width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .window {
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "JetBrains Mono", ui-monospace, Menlo, monospace;
          height: 160px;
          background: #1a1b26;
          border: 1px solid #2f3549;
          border-radius: 10px;
          box-sizing: border-box;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        .titlebar {
          height: 36px;
          background: #1f2335;
          border-bottom: 1px solid #16161e;
          display: flex;
          align-items: center;
          padding: 0 14px;
          position: relative;
        }
        .controls {
          display: flex;
          gap: 7px;
        }
        .btn {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          box-sizing: border-box;
        }
        .close { background: #ff5f56; border: 1px solid #e0443e; }
        .minimize { background: #ffbd2e; border: 1px solid #dea123; }
        .maximize { background: #27c93f; border: 1px solid #1aab29; }
        .title {
          position: absolute;
          left: 0;
          right: 0;
          text-align: center;
          font-size: 12px;
          color: #7aa2f7;
          font-weight: 500;
          letter-spacing: 0.02em;
        }
        .terminal-body {
          flex: 1;
          padding: 0 24px;
          display: flex;
          align-items: center;
          font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
        }
        .prompt {
          font-size: 24px;
          font-weight: 600;
          color: #73daca;
          margin-right: 12px;
        }
        .typing {
          font-size: 24px;
          font-weight: 600;
          color: #c0caf5;
          white-space: nowrap;
          overflow: hidden;
          border-right: 3px solid #7aa2f7;
          width: 17ch;
          animation: typing 3.5s steps(17) infinite alternate, blink 0.75s infinite;
        }
        @keyframes typing {
          0%, 15% { width: 0; }
          60%, 100% { width: 17ch; }
        }
        @keyframes blink {
          50% { border-color: transparent; }
        }
      </style>
      <div class="window">
        <div class="titlebar">
          <div class="controls">
            <div class="btn close"></div>
            <div class="btn minimize"></div>
            <div class="btn maximize"></div>
          </div>
          <div class="title">rahesa — zsh</div>
        </div>
        <div class="terminal-body">
          <span class="prompt">~ &gt;</span>
          <span class="typing">Rahesa Aferdinan</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
