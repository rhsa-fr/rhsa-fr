<svg fill="none" viewBox="0 0 800 150" width="800" height="150" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .box {
          font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
          height: 150px;
          background: #090d14;
          border: 1px solid #1e293b;
          border-radius: 10px;
          padding: 24px;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        .header { display: flex; align-items: center; }
        .dots { display: flex; gap: 6px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #334155; }
        .main-wrap {
          display: flex;
          align-items: center;
        }
        .prompt {
          font-size: 26px;
          font-weight: 700;
          color: #38bdf8;
          margin-right: 10px;
        }
        .typing {
          font-size: 26px;
          font-weight: 700;
          color: #f8fafc;
          white-space: nowrap;
          overflow: hidden;
          border-right: 3px solid #38bdf8;
          width: 17ch;
          animation: typing 3.5s steps(17) infinite alternate, blink 0.75s infinite;
        }
        @keyframes typing {
          0%, 15% { width: 0; }
          60%, 100% { width: 17ch; }
        }
        @keyframes blink {
          50% { border-color: transparent; }
        }
      </style>
      <div class="box">
        <div class="header">
          <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>
        <div class="main-wrap">
          <span class="prompt">&gt;</span>
          <span class="typing">Rahesa Aferdinan</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
