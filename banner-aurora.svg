<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="mesh-1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mesh-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes float-1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes float-2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-40px, 15px); }
    }
    .mesh-box { fill: #030712; stroke: #1e1e2e; stroke-width: 1; rx: 16px; }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.04em;
      fill: #f8fafc;
    }
    .dot-live {
      animation: blink-dot 2s infinite;
    }
    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>

  <rect x="2" y="2" width="796" height="196" class="mesh-box"/>

  <!-- Dynamic ambient glowing orbs -->
  <circle cx="200" cy="80" r="140" fill="url(#mesh-1)" style="animation: float-1 8s ease-in-out infinite;"/>
  <circle cx="620" cy="120" r="130" fill="url(#mesh-2)" style="animation: float-2 10s ease-in-out infinite;"/>

  <!-- Foreground typography -->
  <g transform="translate(400, 115)" text-anchor="middle">
    <text class="title">rhsa-fr</text>
  </g>
  <circle cx="510" cy="90" r="4" fill="#38bdf8" class="dot-live"/>
</svg>
