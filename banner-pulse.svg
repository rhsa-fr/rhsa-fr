<svg fill="none" viewBox="0 0 800 180" width="800" height="180" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .box {
          font-family: ui-monospace, monospace;
          height: 180px;
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 8px;
          padding: 24px 30px;
          box-sizing: border-box;
          color: #c9d1d9;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        .row-top { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 20px; font-weight: 700; color: #58a6ff; letter-spacing: 0.05em; }
        .pulse { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7ee787; }
        .ping { width: 8px; height: 8px; border-radius: 50%; background: #7ee787; box-shadow: 0 0 8px #7ee787; animation: pulse-glow 2s infinite; }
        .center-text { font-size: 14px; color: #f0f6fc; font-weight: 600; }
        .footer-text { font-size: 11px; color: #8b949e; }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
      </style>
      <div class="box">
        <div class="row-top">
          <div class="title">❖ RHSA-FR</div>
          <div class="pulse"><span class="ping"></span>ONLINE</div>
        </div>
        <div class="center-text">Building robust backend architectures and high-throughput systems</div>
        <div class="footer-text">LATENCY: OPTIMAL // UPTIME: 99.9% // STACK: TS • GO • POSTGRES</div>
      </div>
    </div>
  </foreignObject>
</svg>
